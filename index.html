<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Contrail">
<title>Contrail</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<meta name="theme-color" content="#07111D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#E3E9F1; --text:#0D1B2E; --muted:#5B6B80; --hair:rgba(13,27,46,.10);
  --op:#1F7FD1; --dh:#D2851A; --pers:#7666C6; --x:#C9443B; --ok:#2E8B57;
  --ocean-1:#E2ECF6; --ocean-2:#C7D8EA; --land:#FAFCFE; --land-edge:#AFC1D6; --night:rgba(20,40,70,.13); --grat:rgba(13,27,46,.06); --rim:rgba(31,127,209,.25);
  --sheet-shadow:0 -10px 40px rgba(13,27,46,.18);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07111D; --surface:#0E1C2E; --surface-2:#16283F; --text:#E8EFF7; --muted:#8A9DB5; --hair:rgba(232,239,247,.09);
    --op:#4DA6EA; --dh:#F3A84A; --pers:#A896F2; --x:#EE6B61; --ok:#4FBF86;
    --ocean-1:#0E2440; --ocean-2:#081629; --land:#1A3150; --land-edge:#2C4A6E; --night:rgba(0,4,12,.42); --grat:rgba(232,239,247,.05); --rim:rgba(77,166,234,.35);
    --sheet-shadow:0 -10px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07111D; --surface:#0E1C2E; --surface-2:#16283F; --text:#E8EFF7; --muted:#8A9DB5; --hair:rgba(232,239,247,.09);
  --op:#4DA6EA; --dh:#F3A84A; --pers:#A896F2; --x:#EE6B61; --ok:#4FBF86;
  --ocean-1:#0E2440; --ocean-2:#081629; --land:#1A3150; --land-edge:#2C4A6E; --night:rgba(0,4,12,.42); --grat:rgba(232,239,247,.05); --rim:rgba(77,166,234,.35);
  --sheet-shadow:0 -10px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{height:100%;background:var(--bg);scroll-padding-top:var(--sat);touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--op);outline-offset:2px}
.num{font-family:var(--round);font-variant-numeric:tabular-nums;font-weight:700}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--sat)}
/* turned sideways: the app is counter-rotated so it stays upright on the phone */
html[data-rot]{--sat:env(safe-area-inset-left,0px); --sab:env(safe-area-inset-right,0px)}
html[data-rot] body{position:fixed;left:50%;top:50%;width:var(--aw);height:var(--ah)}
html[data-rot="-90"] body{transform:translate(-50%,-50%) rotate(-90deg)}
html[data-rot="90"] body{transform:translate(-50%,-50%) rotate(90deg)}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none}
.tab.on{display:block}
.wrap{max-width:720px;margin:0 auto;padding:12px 18px 40px}
h1{font:800 34px/1.1 var(--round);letter-spacing:-.01em;margin:14px 0 4px}
h2{font:700 20px/1.2 var(--round);margin:30px 0 10px}
h3{font:600 15px/1.3 var(--sans);margin:0}
.sub{color:var(--muted);margin:0 0 14px}
.small{font-size:13px;color:var(--muted)}

/* tab bar */
nav.bar{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--hair);background:var(--bg);padding:6px 4px max(4px,calc(var(--sab) - 14px))}
nav.bar button{flex:1;min-width:0;background:none;border:0;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;position:relative}
nav.bar button svg{width:24px;height:24px}
nav.bar button.on{color:var(--op)}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--x);color:#fff;border-radius:9px;font-size:10.5px;min-width:17px;height:17px;line-height:17px;padding:0 5px;font-weight:700}

/* globe */
#t-globe{overflow:hidden;background:radial-gradient(120% 80% at 50% 40%,var(--surface) 0%,var(--bg) 70%)}
#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.g-top{position:absolute;left:0;right:0;top:0;padding:12px 14px 0;pointer-events:none;display:flex;flex-direction:column;gap:10px;max-width:560px}
.g-top > *{pointer-events:auto}
.flightcard{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--hair);border-radius:18px;padding:12px 14px}
.fc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fc-state{font-size:12.5px;font-weight:600;color:var(--muted)}
.fc-state.live{color:var(--ok)}
.fc-route{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.fc-route .num{font-size:28px;line-height:1}
.fc-line{flex:1;height:2px;background:var(--hair);position:relative;border-radius:2px}
.fc-line i{position:absolute;left:0;top:0;bottom:0;background:var(--op);border-radius:2px}
.fc-line b{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--op);border-radius:50%;box-shadow:0 0 0 4px color-mix(in srgb,var(--op) 25%,transparent)}
.fc-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.fc-actions{display:flex;gap:8px;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--hair);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{color:var(--text);border-color:color-mix(in srgb,var(--text) 22%,transparent)}
.chip select{background:none;border:0;font-weight:600;color:inherit;padding:0;appearance:none;-webkit-appearance:none}
.g-legend{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none}
.g-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.g-zoom button{width:38px;height:38px;border-radius:12px;border:1px solid var(--hair);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:20px;line-height:1;color:var(--text)}

/* buttons */
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--surface-2);color:var(--text)}
.btn.pri{background:var(--op);color:#fff}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:none;color:var(--op);padding-left:0;padding-right:0}
.btn:disabled{opacity:.45}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:9px;padding:7px 7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* logbook */
.logtools{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0 10px;display:flex;flex-direction:column;gap:8px}
.search{width:100%;border:0;background:var(--surface-2);border-radius:11px;padding:10px 12px;font-size:15px}
.month{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:11px 14px 11px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row .cb{align-self:stretch;border-radius:0 3px 3px 0}
.row .rt{display:block;font:700 18px/1.15 var(--round);letter-spacing:.01em}
.row .rr > *{display:block}
.row .rt span{color:var(--muted);font-weight:600;margin:0 4px}
.row .mt{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.row .rr{text-align:right}
.row .rr .num{font-size:16px}
.row .flag{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--x);margin-left:6px;vertical-align:middle}
.c-O{background:var(--op)} .c-D{background:var(--dh)} .c-P{background:var(--pers)} .c-X{background:var(--muted);opacity:.5}
.t-O{color:var(--op)} .t-D{color:var(--dh)} .t-P{color:var(--pers)} .t-X{color:var(--muted)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

/* stats */
.hero{padding:6px 0 4px}
.hero .big{font:800 64px/1 var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .lbl{color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;margin-top:20px}
.kv div .num{font-size:26px;display:block;line-height:1.1}
.kv div span{font-size:13px;color:var(--muted)}
.kv div span.num{font-size:26px;color:var(--text)}
.panel{background:var(--surface);border-radius:18px;padding:14px 16px}
.bars .b{display:grid;grid-template-columns:118px 1fr 64px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bars .b .tr{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bars .b .tr i{display:block;height:100%}
.bars .b .v{text-align:right;font-family:var(--round);font-weight:700;font-variant-numeric:tabular-nums}
.bars .b .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font:600 11px var(--sans)}
.heat{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.heat .c{aspect-ratio:1/1;border-radius:4px;background:var(--surface-2)}
.records{display:grid;grid-template-columns:1fr;gap:0}
.records .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.records .r:last-child{border-bottom:0}
.records .r span:first-child{color:var(--muted)}
.records .r b{font-weight:600;text-align:right}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 10px}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* review */
.card{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.card .why{font-size:14px;margin:8px 0 12px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{border:0;background:var(--surface-2);border-radius:10px;padding:10px 11px;font-size:16px;color:var(--text);width:100%;min-width:0}
.form input,.form select{height:44px}
.form input[type=time],.form input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:44px;line-height:24px;text-align:left}
.form input::-webkit-date-and-time-value{text-align:left;margin:0;min-height:24px}
.form input::-webkit-datetime-edit{padding:0}
/* settings */
.set{background:var(--surface);border-radius:16px;padding:2px 16px}
.set .it{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair);min-height:52px}
.set .it:last-child{border-bottom:0}
.set .it.col{flex-direction:column;align-items:stretch;gap:8px}
.set .it .lab{display:flex;flex-direction:column}
.set .it .lab small{color:var(--muted);font-size:12.5px;margin-top:1px}
.set .it .val{font-family:var(--round);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.sw{position:relative;flex:none;width:51px;height:31px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--surface-2);transition:background .2s}
.sw span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--op);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--op) var(--p,50%),var(--surface-2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);margin-top:-10.5px}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--surface-2)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--op)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.lwprev{height:44px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;padding:0 14px}
.lwprev i{display:block;flex:1;border-radius:4px;background:var(--op)}
.drop{border:1.5px dashed color-mix(in srgb,var(--muted) 50%,transparent);border-radius:16px;padding:18px;text-align:center;color:var(--muted);display:block}
.drop input{display:none}
.preview{margin-top:12px}
.prow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px}
.prow .st{font-size:12px;color:var(--muted)}
.prow select{border:0;background:var(--surface-2);border-radius:8px;padding:5px 6px;font-size:13px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;margin:10px 2px 0;min-height:20px;font-variant-numeric:tabular-nums}
.live::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.live.done::before{background:var(--ok);animation:none}
.live.err{color:var(--x)}.live.err::before{background:var(--x);animation:none}
.live:empty{display:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);max-height:86%;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 20px calc(22px + var(--sab));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:4px auto 10px}
.d-route{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 2px}
.d-route .num{font-size:40px;line-height:1}
.d-route .mid{flex:1;text-align:center;color:var(--muted);font-size:13px;padding-bottom:6px}
.d-city{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:14px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:14px 0}
.d-grid span{display:block;font-size:12.5px;color:var(--muted)}
.d-grid b{font-weight:600}
.d-note{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.d-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(70px + max(4px,calc(var(--sab) - 14px)));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* crew tools */
.tb-box{background:var(--surface-2);border-radius:18px;padding:14px 16px 16px;margin-top:12px}
.tb-box .btn{background:var(--surface)}
.tb-box h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px;letter-spacing:.01em}
.tb-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.tb-grid span{display:block;font-size:12.5px;color:var(--muted)}
.tb-grid b{display:block;font:700 20px/1.2 var(--round);margin-top:3px;font-variant-numeric:tabular-nums}
.tb-grid em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:2px}
.tb-grid em span,.tb-grid b span{display:inline;font:inherit;color:inherit}
.tb-big{font:700 20px/1.25 var(--round)}
.tb-big span{font:600 15px var(--sans);color:var(--muted)}
.wx-now{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid var(--hair)}
.wx-now .tb-big{font-size:30px}
.wx-sun{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair);font-size:14px;color:var(--muted)}
.wx-sun b{color:var(--text);font-family:var(--round)}
.wxi{display:block;flex:none}
.lnk{border:0;background:none;padding:0;color:var(--op);font:inherit;font-weight:600;text-align:left}
.meter{margin:4px 0 12px}
.meter:last-child{margin-bottom:0}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.meter .top b{font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter .tr i{display:block;height:100%;border-radius:4px}
.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ms .m{background:var(--surface);border:0;border-radius:14px;padding:11px 12px;text-align:left;color:var(--text)}
.sheet .ms .m{background:var(--surface-2)}
.ms .m b{display:block;font:700 15px/1.25 var(--round)}
.ms .m span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.nudge{position:fixed;left:12px;right:12px;bottom:calc(68px + max(4px,calc(var(--sab) - 14px)));z-index:15;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--hair);box-shadow:var(--sheet-shadow);border-radius:16px;padding:10px 8px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.nudge span{flex:1}
.nudge .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px}
.wx{display:grid;grid-template-columns:42px 30px 1fr auto;gap:10px 8px;align-items:center;font-size:15px}
.wx .d{font-weight:600}
.wx .t{font-family:var(--round);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ib{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;border:0;background:none;padding:0;color:var(--muted);font-size:13px;text-align:left}
.ib span{display:flex;align-items:center;gap:8px}
.ib i{flex:none;width:8px;height:8px;border-radius:50%}
.gtour .num{font-variant-numeric:tabular-nums}
.bars .b.pay{grid-template-columns:62px 1fr 100px}
.ms .m{display:flex;flex-direction:column;justify-content:flex-start}
.sheet .panel{background:var(--surface-2)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
@media (min-width:900px){.wrap{padding-top:24px}}

/* ---------- airports & geo ---------- */
function ap(c){return store.ap[c]||AP0[c]||null}
const R_KM=6371.0088;
function hav(a,b){const A=ap(a),B=ap(b);if(!A||!B)return null;const r=Math.PI/180,la1=A[2]*r,la2=B[2]*r,dl=(B[3]-A[3])*r,dp=la2-la1;const h=Math.sin(dp/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dl/2)**2;return 2*R_KM*Math.asin(Math.min(1,Math.sqrt(h)))}
function ll(c){const A=ap(c);return A?[A[3],A[2]]:null}
function sunPos(t){ // subsolar point
  const d=(t-Date.UTC(2000,0,1,12))/864e5,r=Math.PI/180;
  const g=(357.529+0.98560028*d)*r,q=280.459+0.98564736*d;
  const L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*r,e=(23.439-0.00000036*d)*r;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec=Math.asin(Math.sin(e)*Math.sin(L));
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24;
  let lon=(ra/r/15-gmst)*15;lon=((lon+540)%360)-180;
  return [lon,dec/r];
}
function sunAlt(lat,lon,sp){const r=Math.PI/180;return Math.asin(Math.sin(lat*r)*Math.sin(sp[1]*r)+Math.cos(lat*r)*Math.cos(sp[1]*r)*Math.cos((lon-sp[0])*r))/r}
function nightMin(f){
  if(!f.out||!f.inn)return null;const A=ll(f.dep),B=ll(f.arr);if(!A||!B)return null;
  const dur=(f.inn-f.out)/6e4;if(dur<=0)return null;const ip=d3.geoInterpolate(A,B);let n=0;const step=5;
  for(let m=step/2;m<dur;m+=step){const p=ip(m/dur);const s=sunPos(f.out.getTime()+m*6e4);if(sunAlt(p[1],p[0],s)<-6)n+=Math.min(step,dur-m+step/2)}
  return n;
}
/* time zones */
const dtfCache={};
function dtf(tz,opt){const k=tz+JSON.stringify(opt);return dtfCache[k]||(dtfCache[k]=new Intl.DateTimeFormat("en-GB",Object.assign({timeZone:tz},opt)))}
function tzOf(c){const A=ap(c);return A?A[4]:"UTC"}
function hm(d,tz){return dtf(tz,{hour:"2-digit",minute:"2-digit",hour12:false}).format(d)}
function dayStr(d,tz){return dtf(tz,{day:"numeric",month:"short"}).format(d)}
function fullDate(d,tz){return dtf(tz,{weekday:"short",day:"numeric",month:"short",year:"numeric"}).format(d)}
function ymdIn(d,tz){const p=dtf(tz,{year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);const g=t=>p.find(x=>x.type===t).value;return g("year")+"-"+g("month")+"-"+g("day")}
function tzOffsetMin(utcMs,tz){const p=dtf(tz,{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date(utcMs));const g=t=>+p.find(x=>x.type===t).value;let h=g("hour");if(h===24)h=0;return (Date.UTC(g("year"),g("month")-1,g("day"),h,g("minute"),g("second"))-utcMs)/6e4}
function zonedToUtc(ymd,hhmm,tz){const[y,m,d]=ymd.split("-").map(Number);const[h,mi]=hhmm.split(":").map(Number);const guess=Date.UTC(y,m-1,d,h,mi);let off=tzOffsetMin(guess,tz);let t=guess-off*6e4;const off2=tzOffsetMin(t,tz);if(off2!==off)t=guess-off2*6e4;return new Date(t)}

/* ---------- flights ---------- */
let FL=[],BYID={};const derived={};
function rowToF(r){const[id,d,f,a,b,o,i,c,e,t,reg,s,k,n,tb,rp,ra]=r;return{id,date:d,flt:f,dep:a,arr:b,out:o?new Date(o+":00Z"):null,inn:i?new Date(i+":00Z"):null,rep:rp?new Date(rp+":00Z"):null,repAt:ra||a,cat:c,emp:e,ac:t,reg,src:s,check:!!k,note:n,tb,user:false}}
function objToF(o){return Object.assign({},o,{out:o.out?new Date(o.out):null,inn:o.inn?new Date(o.inn):null,rep:o.rep?new Date(o.rep):null,user:true})}
function build(){
  const del=new Set(store.del);FL=[];BYID={};
  for(const r of HIST){if(del.has(r[0]))continue;FL.push(rowToF(r))}
  for(const o of store.add){if(del.has(o.id))continue;FL.push(objToF(o))}
  for(const f of FL){
    const ov=store.ov[f.id];
    if(ov){if(ov.c)f.cat=ov.c;if(ov.ac)f.ac=ov.ac;if(ov.reg)f.reg=ov.reg;if(ov.emp)f.emp=ov.emp;if(ov.al)f.al=ov.al;if(ov.tko)f.tko=new Date(ov.tko);if(ov.ldg)f.ldg=new Date(ov.ldg);if(ov.fr24)f.fr24=ov.fr24;if(ov.adb)f.adb=ov.adb;if(ov.ibReg)f.ibReg=ov.ibReg;if(ov.out)f.out=new Date(ov.out);if(ov.inn)f.inn=new Date(ov.inn);if(ov.rep){f.rep=new Date(ov.rep);f.repAt=ov.repAt||f.dep}f.ok=!!ov.ok}
    f.t=f.out?f.out.getTime():Date.parse(f.date+"T12:00:00Z");
    const key=f.id+"|"+f.t+"|"+(f.inn?f.inn.getTime():0)+"|"+f.dep+f.arr;
    let dv=derived[f.id];
    if(!dv||dv.key!==key){dv=derived[f.id]={key,km:hav(f.dep,f.arr),night:nightMin(f)};}
    f.km=dv.km;f.nightH=dv.night==null?null:dv.night/60;
    f.bh=(f.out&&f.inn)?(f.inn-f.out)/36e5:null;
    f.year=(f.out?f.out.toISOString():f.date).slice(0,4);
    BYID[f.id]=f;
  }
  FL.sort((a,b)=>a.t-b.t);
}

function flightLine(f){

   const groups=[];for(const f of O.concat(D)){if(!f.rep||!f.inn)continue;const g=groups[groups.length-1];if(g&&g.rep===f.rep.getTime())g.end=f.inn.getTime();else groups.push({rep:f.rep.getTime(),end:f.inn.getTime()})}
   const dutyH=groups.reduce((s,g)=>s+(g.end-g.rep)/36e5+0.5,0);
   if(ds.length||groups.length){h+=`<h2>Duties</h2><div class="panel"><div class="kv" style="margin-top:0">

   </div><p class="note">Duty hours run from report time to 30 minutes after the last landing, for rosters that include report times. Duty days come from your imported rosters.</p></div>`}}

 },
 bars(title,rows,col,note){if(!rows.length)return"";const mx=Math.max(...rows.map(r=>r[1]));

function addAirport(code,after){
  Sheet.open(`<h2 style="margin-top:6px">Add ${esc(code)}</h2><p class="small">Latitude and longitude in decimal degrees, and the airport's time zone, for example Asia/Dubai.</p>
  <div class="form"><label class="full">City<input id="a-c"></label><label>Latitude<input id="a-la" inputmode="decimal"></label><label>Longitude<input id="a-lo" inputmode="decimal"></label><label>Country code<input id="a-cc" maxlength="2" placeholder="AE"></label><label>Time zone<input id="a-tz" placeholder="Asia/Dubai"></label></div>
  <div class="d-acts"><button class="btn pri" id="a-save">Save airport</button>${CAP.sample?`<button class="btn" id="a-look">Look it up</button>`:""}</div><p class="note" id="a-msg"></p>`,el=>{
   const fill=o=>{el.querySelector("#a-c").value=o.city||"";el.querySelector("#a-la").value=o.lat??"";el.querySelector("#a-lo").value=o.lon??"";el.querySelector("#a-cc").value=o.country||"";el.querySelector("#a-tz").value=o.tz||""};
   const lk=el.querySelector("#a-look");if(lk)lk.onclick=async()=>{el.querySelector("#a-msg").textContent="Looking up "+code+"…";try{const o=await CAP.sample.json(`Give details for the airport with IATA code ${code}. Reply with JSON only: {"city":string,"lat":number,"lon":number,"country":ISO 3166-1 alpha-2 string,"tz":IANA time zone string}.`,{modelTier:"quick"});fill(o);el.querySelector("#a-msg").textContent="Check the details, then save."}catch(e){el.querySelector("#a-msg").textContent="Lookup failed. Enter the details by hand."}};
   el.querySelector("#a-save").onclick=()=>{const la=parseFloat(el.querySelector("#a-la").value),lo=parseFloat(el.querySelector("#a-lo").value),tz=el.querySelector("#a-tz").value.trim()||"UTC";
    if(isNaN(la)||isNaN(lo)||Math.abs(la)>90||Math.abs(lo)>180){el.querySelector("#a-msg").textContent="Latitude must be between -90 and 90 and longitude between -180 and 180.";return}
    try{new Intl.DateTimeFormat("en",{timeZone:tz})}catch(e){el.querySelector("#a-msg").textContent=tz+" is not a valid time zone name.";return}
    store.ap[code]=[el.querySelector("#a-c").value.trim()||code,el.querySelector("#a-cc").value.trim().toUpperCase(),la,lo,tz];for(const k in derived)delete derived[k];save();refreshAll();Sheet.close();toast(code+" added");if(after)after()};
  });
}

  if(hit&&Date.now()-hit.t<60*6e4)return hit;
  try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${A[2]}&longitude=${A[3]}&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=16&timeformat=unixtime`;
   const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
   const keep={};for(const k in all)if(Date.now()-all[k].t<3*864e5)keep[k]=all[k];keep[code]={t:Date.now(),d};lsSet("contrail.wx",keep);return keep[code]}

  return i<0?null:{temp:H.temperature_2m[i],code:H.weather_code[i],rain:H.precipitation_probability?H.precipitation_probability[i]:null,wind:H.wind_speed_10m[i]}},
 // daily rows for the local days from a to b at the airport

const FX={

// weather icons drawn inline so they work offline: sun, cloud, rain, snow, fog, storm
function wxIcon(code,s){s=s||28;const c=+code,sun='<circle cx="12" cy="12" r="4.2" fill="#F5B83D"/><g stroke="#F5B83D" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>',
  cloud=(x,y,col)=>`<path transform="translate(${x||0} ${y||0})" d="M7 18h10.5a3.8 3.8 0 0 0 .4-7.6A5.5 5.5 0 0 0 7.3 9.6 4.2 4.2 0 0 0 7 18z" fill="${col||"#9FB1C7"}"/>`,
  drops='<g stroke="#4DA6EA" stroke-width="1.8" stroke-linecap="round"><path d="M9 19.5l-1 2.5M13 19.5l-1 2.5M17 19.5l-1 2.5"/></g>',
  flakes='<g fill="#CFE3F7"><circle cx="8.5" cy="21" r="1.2"/><circle cx="12.5" cy="22" r="1.2"/><circle cx="16.5" cy="21" r="1.2"/></g>';
 let g;
 if(c<=1)g=sun;
 else if(c===2)g=`<g transform="translate(-3 -4) scale(.85)">${sun}</g>`+cloud(1,2);
 else if(c===3)g=cloud(0,1);
 else if(c===45||c===48)g=cloud(0,-2)+'<g stroke="#9FB1C7" stroke-width="1.8" stroke-linecap="round"><path d="M5 19.5h14M7 22.5h10"/></g>';
 else if(c>=71&&c<=77||c===85||c===86)g=cloud(0,-3)+flakes;
 else if(c>=95)g=cloud(0,-3,"#7E8FA6")+'<path d="M12.5 15.5l-2.5 4h3l-2 4" fill="none" stroke="#F5B83D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
 else if(c>=51)g=cloud(0,-3)+drops;
 else g=cloud(0,1);
 return`<svg class="wxi" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${g}</svg>`}
const Trip={

 cell(k,v,sub){return`<div><span>${esc(k)}</span><b>${v}</b>${sub?`<em>${sub}</em>`:""}</div>`},
 open(id){const f=BYID[id];if(!f)return;const tzA=tzOf(f.dep),tzB=tzOf(f.arr),now=Date.now(),p=Duty.of(f),nx=this.after(f),home=f.arr===baseOf(f);
  const off=t=>tzOffsetMin(t,tzB)-tzOffsetMin(t,tzA),d=off(f.inn?+f.inn:now),dh=Math.abs(d)/60;
  const diff=d===0?`Same time as ${esc(shortCity(f.dep))}`:`${dh%1?nf1.format(dh):dh} h ${d>0?"ahead of":"behind"} ${esc(shortCity(f.dep))}`;
  const until=t=>{const m=(t-now)/6e4;return m<=0?"":m<90?"in "+Math.round(m)+" min":m<48*60?"in "+durText(m/60):"in "+Math.round(m/1440)+" days"};
  const A=ap(f.arr),cc=A&&A[1],cur=cc&&CURR[cc],homeCur="AED";
  const C=(k,v,sub)=>this.cell(k,v,sub);
  Sheet.open(`<div class="d-route"><span class="num">${esc(f.dep)}</span><div class="mid">${esc(f.flt)}<br>${f.bh!=null?HM(f.bh)+" block":""}</div><span class="num">${esc(f.arr)}</span></div>
   <div class="d-city"><span>${esc(city(f.dep))}</span><span>${esc(city(f.arr))}</span></div>
   <div class="tb-box"><h3>Your duty</h3><div class="tb-grid">
    ${p?C("Report"+(p.repKnown?"":", estimated"),esc(hm(new Date(p.start),tzOf(p.repAt))),p.start>now?esc(until(p.start)):""):""}
    ${C("Departs",f.out?esc(hm(f.out,tzA)):"–",f.out?esc(dayStr(f.out,tzA)):"")}

   </div><p class="small" style="margin:10px 0 0">Times are local at each airport.</p></div>
   <div class="tb-box"><h3>${esc(shortCity(f.arr))}</h3><div class="tb-grid">
    ${C("Local time now",esc(hm(new Date(now),tzB)),diff)}
    ${home?C("Layover","Home",""):nx?C("Layover",esc(durText((nx.out-f.inn)/36e5)),"until "+esc(nx.flt)+" "+esc(hm(nx.out,tzB))+", "+esc(dayStr(nx.out,tzB))):""}
   </div></div>
   <div id="tb-ib"></div>
   <div class="tb-box"><h3>Weather in ${esc(shortCity(f.arr))}</h3><div id="tb-wx" class="small">Loading the forecast…</div></div>
   ${cur&&cur!==homeCur?`<div class="tb-box"><h3>Money</h3><div id="tb-fx" class="tb-big">${esc(FX.name(cur))}</div></div>`:""}
   <div class="d-acts" style="margin-top:16px"><button class="btn sm" id="tb-share">Share</button><button class="btn sm" id="tb-open">Flight details</button></div>`,el=>{
   el.querySelector("#tb-share").onclick=()=>shareFlight(f.id);el.querySelector("#tb-open").onclick=()=>openFlight(f.id);

    if(!at&&!days.length){box.textContent=f.inn&&+f.inn>now+15*864e5?"The forecast opens about two weeks before the flight.":"No forecast for these days.";return}
    const sd=days.find(x=>!f.inn||x.rise>+f.inn)||days[0];
    box.className="";box.innerHTML=(at?`<div class="wx-now">${wxIcon(at.code,52)}<div><div class="tb-big">${Math.round(at.temp)}° <span>${esc(WX.text(at.code))}</span></div><div class="small">On landing${at.wind!=null?" · wind "+Math.round(at.wind)+" km/h":""}${at.rain?" · "+at.rain+"% rain":""}</div></div></div>`:"")+
     (days.length?`<div class="wx">${days.map(x=>`<span class="d">${esc(dtf(tzB,{weekday:"short"}).format(new Date(x.mid)))}</span>${wxIcon(x.code,26)}<span>${esc(WX.text(x.code))}${x.rain?` <span class="small">${x.rain}%</span>`:""}</span><span class="t">${Math.round(x.hi)}° <span class="small">${Math.round(x.lo)}°</span></span>`).join("")}</div>`:"")+
     (sd?`<div class="wx-sun"><span>Sunrise <b>${esc(hm(new Date(sd.rise),tzB))}</b></span><span>Sunset <b>${esc(hm(new Date(sd.set),tzB))}</b></span></div>`:"")+
     `<p class="small" style="margin:10px 0 0">From Open-Meteo${w.stale?", saved "+esc(agoText(w.t)):""}.</p>`});

};

// Which aircraft will fly your next flight, where it's coming from, and whether it will be late.
const Inbound={
 cfg(){return Object.assign({auto:true},store.ib||{})},
 all(){return lsGet("contrail.inbound",{})||{}},
 get(f){return f?this.all()[f.id]||null:null},
 put(f,v){const a=this.all(),keep={};for(const k in a)if(BYID[k]&&BYID[k].out&&+BYID[k].out>Date.now()-864e5)keep[k]=a[k];keep[f.id]=v;lsSet("contrail.inbound",keep)},
 // the next departure, from 24 h before until it leaves

 busy:false,
 tick(){const f=this.target(),C=this.cfg();if(!f||!ADB.key()||!C.auto||this.busy||document.hidden||!Globe.on)return;const now=Date.now();if(+f.out-now>3*36e5)return;
  const c=this.get(f);if(c&&now-c.t<30*6e4)return;this.check(f)},

 est(r){const a=r.arrival||{},rw=ADB.utc(a.runwayTime),rv=ADB.utc(a.revisedTime),pr=ADB.utc(a.predictedTime);return rv||pr||(rw?rw+10*6e4:0)||ADB.utc(a.scheduledTime)},
 async check(f){if(this.busy)return;this.busy=true;const now=Date.now(),old=this.get(f)||{},no=FR24.fltNo(f.flt),ymd=ymdIn(f.out,tzOf(f.dep));
  const q=s=>s+"?dateLocalRole=Both&withAircraftImage=false&withLocation=true";
  const res={t:now,reg:f.ibReg||"",regT:old.regT||0,guess:false};
  try{
   let our=null,list=[];
   if(!res.reg&&old.reg&&now-old.regT<2*36e5){res.reg=old.reg}
   if(!res.reg){const rows=await ADB.get(q(`/flights/number/${encodeURIComponent(no)}/${ymd}`));
    our=this.pick(rows,r=>(r.departure&&r.departure.airport&&r.departure.airport.iata)===f.dep&&Math.abs(this.sched(r,"departure")-f.out)<6*36e5)[0]||null;
    if(our&&our.aircraft&&our.aircraft.reg){res.reg=our.aircraft.reg;res.regT=now}}
   let ib=null;
   if(res.reg){list=await ADB.get(q(`/flights/reg/${encodeURIComponent(res.reg)}/${ymd}`));
    our=our||this.pick(list,r=>(r.departure&&r.departure.airport&&r.departure.airport.iata)===f.dep&&Math.abs(this.sched(r,"departure")-f.out)<6*36e5)[0]||null;
    const arr=this.pick(list,r=>r!==our&&(r.arrival&&r.arrival.airport&&r.arrival.airport.iata)===f.dep&&this.sched(r,"arrival")<+f.out+30*6e4).sort((a,b)=>this.sched(b,"arrival")-this.sched(a,"arrival"));
    ib=arr[0]||null}
   else if(f.dep!==baseOf(f)){ // away from base the same aircraft usually comes in on the paired flight number
    const m=no.match(/^(\D+|\w\d)(\d+)$/)||no.match(/^([A-Z0-9]{2})(\d+)$/);
    if(m){const n=+m[2],ino=m[1]+(n%2?n+1:n-1),rows=await ADB.get(q(`/flights/number/${ino}/${ymd}`));

   if(c.ourEst)h+=C("Your departure",esc(hm(new Date(c.ourEst),tz)),Math.abs(c.ourEst-f.out)>=5*6e4?`<span style="color:${this.col(Math.round((c.ourEst-f.out)/6e4))}">${esc(this.lateText(Math.round((c.ourEst-f.out)/6e4)))}</span>`:"as scheduled");
